services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: docs-scope-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docsscope

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docsscope"]
      interval: 2s
      timeout: 5s
      retries: 15

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
